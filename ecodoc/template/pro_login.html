{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Custom CSS */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .login-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #dbe9f9 6%, rgba(219, 236, 250, 0) 100%); /* Light blue gradient */
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-title {
            font-size: 35px;
            font-weight: bold;
            color: #333; /* Dark gray */
            margin-bottom: 30px;
        }

        .login-input {
            width: 100%;
            height: 40px;
            font-size: 20px;
            margin-bottom: 20px; /* Increased spacing between input fields */
            padding: 5px 10px;
            box-sizing: border-box;
        }

        .login-button {
            width: calc(100% - 20px); /* Adjusted width */
            height: 50px;
            background-color: #3498db; /* Medium blue */
            color: #fff;
            font-size: 25px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px; /* Increased spacing between button and input fields */
        }

        .forgot-password {
            font-size: 20px;
            color: #333; /* Dark gray */
            cursor: pointer;
            margin-top: 20px; /* Added margin-top to separate from button */
        }
    </style>
</head>
<body>
<form method="post">
    {% csrf_token %}
    <div class="login-container">
        <div class="login-box">
            <div class="login-title">LOGIN</div>
            <div class="login-input">
                Username:
                <input type="text" required id="pro_name" name="pro_name" class="login-input">
            </div>
            <div class="login-input">
                Password:
                <input type="password" id="password" name="password" class="login-input">
            </div>
            <button type="submit" class="login-button">SIGN IN</button>
        </div>
    </div>
</form>
{% if alert_message %}
    <script>
        // Display an alert message using JavaScript
        alert("{{ alert_message }}");
    </script>
{% endif %}
</body>
</html>
